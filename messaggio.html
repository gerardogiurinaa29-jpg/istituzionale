<pre id="m"></pre></div>
<script>{const M="🏛️ *M&M Re d'Italia Art*\n👑 *Folder Istituzionale Re d'Italia Art*\n\nGentile Art Dealer 💼,\necco il nostro *nuovo folder istituzionale digitale*: la maison sempre con te, sul telefono, sul tablet e sul computer. 📲\n\n🌱 *Una scelta di sostenibilità*\nOggi siamo sempre più un'azienda che guarda al futuro e all'ambiente. Stampare carta inutilmente non è più possibile: il digitale è la nostra strada, per tutti e da subito.\n\n✨ *Tutti i vantaggi*\n🔄 *Sempre aggiornato*: si aggiorna in automatico con eventi, novità e iniziative dell'azienda\n🔗 *Link attivi*: collegamenti diretti ad approfondimenti e contenuti\n🎯 *Semplice da presentare*: si apre in un tocco, davanti al cliente\n🖼️ *Immagini perfette*: colori e dettagli delle opere sempre nitidi\n💎 *Non si sgualcisce, non si rovina, non si perde*\n📤 *Si condivide in un attimo*: un link via WhatsApp o email\n🎒 *Zero peso, zero scorte*: niente ristampe né copie da portare\n💶 *Meno costi* di stampa e spedizione\n🌍 *Meno carta, meno sprechi*: un gesto concreto per l'ambiente\n\n🔄 *Sempre l'ultima versione, in automatico*\nOgni novità della maison (eventi, opere, iniziative) compare da sola: *non devi scaricare né reinstallare nulla*.\n👉 Apri sempre il folder dall'icona *Re d'Italia Art*: trovi sempre la versione aggiornata.\n🔁 Se lo avevi già aperto, chiudilo e riaprilo (o ricarica la pagina) per vedere le novità.\n🚫 Non salvare né inviare copie, screenshot o PDF: diventano subito vecchi. Condividi sempre il *link*.\n📖 Sul computer si sfoglia *come un libro aperto*, a doppia pagina.\n\n📲 *Installa l'app in 1 minuto*\n👉 https://gerardogiurinaa29-jpg.github.io/istituzionale/\n\n🍏 *iPhone*: Safari → Condividi ⬆️ → *Aggiungi alla schermata Home* → *Aggiungi*\n🤖 *Android*: Chrome → tre puntini ⋮ → *Aggiungi a schermata Home* → *Installa*\n💻 *Computer*: Chrome → tre puntini ⋮ → *Trasmetti, salva e condividi* → *Installa pagina come app*\n\n👑 Troverai l'icona *Re d'Italia Art* con la corona.\n\n⚠️ *Da oggi il folder istituzionale si presenta in digitale*: niente più stampe inutili. Usiamolo tutti, in ogni appuntamento.\n\nBuon lavoro! 🥂\n*La Direzione – M&M Re d'Italia Art*";const m=document.getElementById("m"),b=document.getElementById("b");m.textContent=M;
b.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(M);}catch(e){const t=document.createElement("textarea");t.value=M;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();}b.textContent="✅ Copiato! Ora incollalo su WhatsApp";b.className="ok";});}</script></body></html>
